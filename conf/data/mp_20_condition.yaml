root_path: ${oc.env:PROJECT_ROOT}/data/mp_20
prop: formation_energy_per_atom
num_targets: 1
niggli: true
primitive: false
graph_method: crystalnn
lattice_scale_method: scale_length
preprocess_workers: 30
readout: mean
max_atoms: 20
otf_graph: false
eval_model_name: mp20
tolerance: 0.1

use_conditions: true
prop_stats_path: null

use_space_group: false
use_pos_index: false
train_max_epochs: 1000
early_stopping_patience: 100000
teacher_forcing_max_epoch: 500

datamodule:
  _target_: pidcsp.pl_data.datamodule_conditional.ConditionalCrystDataModule


  prop_stats_save_path: ${data.root_path}/prop_stats_cache

  datasets:
    train:
      _target_: pidcsp.pl_data.dataset_conditional.ConditionalCrystDataset
      name: Conditional train
      path: ${data.root_path}/train.csv
      save_path: ${data.root_path}/train_ori.pt
      prop: ${data.prop}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      tolerance: ${data.tolerance}
      use_space_group: ${data.use_space_group}
      use_pos_index: ${data.use_pos_index}
      lattice_scale_method: ${data.lattice_scale_method}
      preprocess_workers: ${data.preprocess_workers}
      use_conditions: ${data.use_conditions}
      prop_stats_path: ${data.prop_stats_path}

    val:
      - _target_: pidcsp.pl_data.dataset_conditional.ConditionalCrystDataset
        name: Conditional val
        path: ${data.root_path}/val.csv
        save_path: ${data.root_path}/val_ori.pt
        prop: ${data.prop}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        tolerance: ${data.tolerance}
        use_space_group: ${data.use_space_group}
        use_pos_index: ${data.use_pos_index}
        lattice_scale_method: ${data.lattice_scale_method}
        preprocess_workers: ${data.preprocess_workers}
        use_conditions: ${data.use_conditions}
        prop_stats_path: ${data.prop_stats_path}

    test:
      - _target_: pidcsp.pl_data.dataset_conditional.ConditionalCrystDataset
        name: Conditional test
        path: ${data.root_path}/test.csv
        save_path: ${data.root_path}/test_ori.pt
        prop: ${data.prop}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        tolerance: ${data.tolerance}
        use_space_group: ${data.use_space_group}
        use_pos_index: ${data.use_pos_index}
        lattice_scale_method: ${data.lattice_scale_method}
        preprocess_workers: ${data.preprocess_workers}
        use_conditions: ${data.use_conditions}
        prop_stats_path: ${data.prop_stats_path}

  num_workers:
    train: 0
    val: 0
    test: 0

  batch_size:
    train: 256
    val: 128
    test: 128