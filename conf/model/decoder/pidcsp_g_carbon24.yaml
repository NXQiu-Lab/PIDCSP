_target_: pidcsp.pl_modules.pidcsp_g.PIDCSPNet
hidden_dim: 512
latent_dim: 0
max_atoms: 100
num_layers: 6
act_fn: silu
dis_emb: sin
num_freqs: 256
edge_style: fc
max_neighbors: ${model.max_neighbors}
cutoff: ${model.radius}
ln: true
ip: true
smooth: false
pred_type: false
pred_scalar: false

use_phys_emb: false
phys_props: false
phys_props_grad: false
phys_pg: false
phys_data_path: ${oc.env:PROJECT_ROOT,.}/embeddings/phys_embedding_data.pt


use_attention: true
num_heads: 8
dropout: 0.0
alpha: 0.2
phys_edge_weight: 0.0

use_time_phys_mod: true
time_mod_min: 0.8
use_phys_type_guidance: false
use_phys_lattice_bias: true