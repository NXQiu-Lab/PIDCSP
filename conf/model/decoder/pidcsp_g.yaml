phys_data_path: ${oc.env:PROJECT_ROOT,.}/embeddings/phys_embedding_data.pt


use_attention: true
num_heads: 8

alpha: 0.2
use_time_phys_mod: true


use_phys_type_guidance: true
use_phys_lattice_bias: true


dropout: 0.0
phys_edge_weight: 0.6

time_mod_min: 0.6
