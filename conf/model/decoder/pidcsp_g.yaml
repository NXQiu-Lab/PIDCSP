_target_: pidcsp.pl_modules.pidcsp_g.PIDCSPNet
hidden_dim: 512
latent_dim: 0
max_atoms: 100
num_layers: 6
act_fn: silu
dis_emb: sin
num_freqs: 128
edge_style: fc
max_neighbors: ${model.max_neighbors}
cutoff: ${model.radius}
ln: true
ip: true
smooth: false
pred_type: false
pred_scalar: false

use_phys_emb: true
phys_props: true
phys_props_grad: false
